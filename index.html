<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ancelia - Download App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 500px;
        }

        .download-btn {
            margin-top: 1.5rem;
            align-items: center;
            background-color: #cc3378;
            border-radius: 2rem;
            border: 1px solid #cc3378;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            color: #fff;
            cursor: pointer;
            display: inline-flex;
            font-size: 1.25rem;
            font-weight: 400;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            background-color: #c64986 !important;
            border-color: #c64986 !important;
            box-shadow: 0 8px 4px -4px rgba(0, 0, 0, .3);
        }

        .download-icon {
            width: 16px;
            height: 16px;
        }
    </style>
</head>
<body>
    <div class="container">        
        <img src="assets/ancelia.svg" alt="logo"/>
        
        <a href="https://github.com/TeiaCare/CarerApp/releases/download/Ancelia/teiacare_2.18.1.apk" class="download-btn" download>
            <svg class="download-icon" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd"></path>
            </svg>
            Scarica app
        </a>
    </div>
</body>
</html>
